<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안성여고 실시간 현황 대시보드</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: var(--primary); text-align: center; margin-top: 0; border-bottom: 2px solid var(--accent); padding-bottom: 15px; margin-bottom: 25px; }
        
        /* 필터 섹션 스타일 */
        .filter-section { 
            background: #f1f4f8; 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            display: flex; 
            gap: 15px; 
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-weight: bold; color: var(--primary); }
        .filter-group select { 
            padding: 8px 12px; 
            border: 1px solid #cbd5e0; 
            border-radius: 6px; 
            background: white;
            font-size: 1em;
            cursor: pointer;
        }

        .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: bold; color: #555; }
        .refresh-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .refresh-btn:hover { background: #2980b9; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 1.05em; }
        th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #eee; }
        th { background-color: var(--primary); color: white; position: sticky; top: 0; z-index: 10; }
        
        /* 상태별 행 스타일 */
        .row-empty { color: #ccc; background-color: #fafafa; } /* 미접속 */
        .row-active { background-color: #fff; color: #2c3e50; } /* 진행 중 또는 완료 */
        tr:hover { background-color: #f1f7fd; }

        .status-ing { color: #e67e22; font-weight: bold; background: #fdf2e9; padding: 4px 10px; border-radius: 20px; font-size: 0.9em; }
        .status-done { color: #27ae60; font-weight: bold; background: #e9f7ef; padding: 4px 10px; border-radius: 20px; font-size: 0.9em; }
        .status-waiting { color: #bdc3c7; font-size: 0.9em; }

        .no-data { padding: 50px; color: #a0aec0; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 안성여고 수행평가 실시간 관제 센터</h1>
    
    <div class="filter-section">
        <div class="filter-group">
            <label>학년</label>
            <select id="filterGrade" onchange="fetchData()">
                <option value="">-- 선택 --</option>
                <option value="1">1학년</option>
                <option value="2">2학년</option>
                <option value="3">3학년</option>
            </select>
        </div>
        <div class="filter-group">
            <label>반</label>
            <select id="filterClass" onchange="fetchData()">
                <option value="">-- 선택 --</option>
                <option value="1">1반</option><option value="2">2반</option>
                <option value="3">3반</option><option value="4">4반</option>
                <option value="5">5반</option><option value="6">6반</option>
                <option value="7">7반</option><option value="8">8반</option>
                <option value="9">9반</option><option value="10">10반</option>
                <option value="11">11반</option><option value="12">12반</option>
            </select>
        </div>
    </div>

    <div class="status-header">
        <span id="lastUpdated">대기 중 (학년/반을 선택하세요)</span>
        <div>
            <span style="font-size: 0.85em; margin-right: 10px; color: #7f8c8d;">(5초 자동 갱신)</span>
            <button class="refresh-btn" onclick="fetchData()">🔄 즉시 새로고침</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th width="80">번호</th>
                <th width="120">이름</th>
                <th width="150">상태</th>
                <th>시작 시간</th>
                <th>종료 시간</th>
                <th>소요 시간</th>
                <th width="150">비고 (경고현황)</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="7" class="no-data">👆 상단에서 모니터링할 학년과 반을 모두 선택해 주세요.</td></tr>
        </tbody>
    </table>
</div>

<script>
    // ⚠️ 주의: 선생님의 스크립트 주소 (끝에 ?sheet=status 확인)
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJjUAPyw8wzO0dyuO_4HtNE8mFAW75QZ6yrQB9zYD9Nz3pbFohHDB7NkyC0pFUVaBY/exec?sheet=status";

    async function fetchData() {
        const selectedGrade = document.getElementById('filterGrade').value;
        const selectedClass = document.getElementById('filterClass').value;
        const tbody = document.getElementById('tableBody');

        // 학년/반 중 하나라도 선택되지 않으면 데이터 로드 차단
        if (!selectedGrade || !selectedClass) {
            tbody.innerHTML = '<tr><td colspan="7" class="no-data">👆 모니터링할 학년과 반을 모두 선택해 주세요.</td></tr>';
            return; 
        }

        try {
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const data = await response.json();
            
            // 1. 선택한 학년과 반 데이터만 필터링
            const classData = data.filter(row => {
                const rowGrade = String(row['학년'] || "");
                const rowClass = String(row['반'] || "");
                return (rowGrade === selectedGrade || rowGrade === selectedGrade + "학년") && 
                       (rowClass === selectedClass || rowClass === selectedClass + "반");
            });

            // 2. 번호를 기준으로 데이터 매핑 (중복일 경우 나중 데이터 덮어쓰기)
            const studentMap = {};
            classData.forEach(row => {
                studentMap[parseInt(row['번호'])] = row;
            });

            // 3. 1번부터 35번까지 행(지정석) 생성
            tbody.innerHTML = ''; 
            for (let i = 1; i <= 35; i++) {
                const student = studentMap[i];
                const tr = document.createElement('tr');
                
                if (student) {
                    // 데이터가 있는 경우 (진행 중이거나 제출 완료)
                    tr.className = 'row-active';
                    
                    let statusRaw = student['상태'] || '-';
                    let statusHtml = statusRaw.includes('진행 중') 
                        ? `<span class="status-ing">🟢 진행 중</span>` 
                        : `<span class="status-done">🔵 제출 완료</span>`;

                    // 비고란 텍스트 (빈칸일 경우 정상상태로 표기)
                    let remark = student['비고'] || '정상상태';
                    
                    tr.innerHTML = `
                        <td><b>${i}</b></td>
                        <td>${student['이름'] || '-'}</td>
                        <td>${statusHtml}</td>
                        <td>${formatDate(student['시작시간'] || student['시작 시간'])}</td>
                        <td>${formatDate(student['종료시간'] || student['종료 시간'])}</td>
                        <td>${student['소요시간'] || student['소요 시간'] || '-'}</td>
                        <td style="font-weight:bold; color:${getRemarkColor(remark)};">${remark}</td>
                    `;
                } else {
                    // 데이터가 없는 경우 (미접속)
                    tr.className = 'row-empty';
                    tr.innerHTML = `
                        <td>${i}</td>
                        <td>-</td>
                        <td><span class="status-waiting">미접속</span></td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                    `;
                }
                tbody.appendChild(tr);
            }
            
            updateTime();
        } catch (error) {
            console.error("데이터 로드 실패:", error);
            document.getElementById('lastUpdated').innerText = "데이터 갱신 오류";
        }
    }

    // 시간 포맷팅 함수
    function formatDate(dateString) {
        if (!dateString || dateString === "-") return "-";
        const d = new Date(dateString);
        if (isNaN(d)) return dateString; 
        return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}:${d.getSeconds().toString().padStart(2, '0')}`;
    }

    // 비고란(경고/제출) 색상 지정 함수
    function getRemarkColor(remark) {
        if (remark.includes("1차경고")) return "#f1c40f"; // 경고: 노랑
        if (remark.includes("2차경고")) return "#e67e22"; // 위험: 주황
        if (remark.includes("강제제출")) return "#e74c3c"; // 아웃: 빨강
        if (remark.includes("시간초과")) return "#8e44ad"; // 초과: 보라
        return "#27ae60"; // 정상: 초록
    }

    // 마지막 업데이트 시간 텍스트 갱신
    function updateTime() {
        const now = new Date();
        document.getElementById('lastUpdated').innerText = `마지막 업데이트: ${now.toLocaleTimeString()}`;
    }

    // 5초(5000ms)마다 백그라운드에서 자동 갱신 (학년/반이 선택되어 있을 때만 내부 로직 실행)
    setInterval(fetchData, 5000);
</script>
</body>
</html>
