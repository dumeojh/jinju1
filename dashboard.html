<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>안성여고 실시간 현황 대시보드</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h1 { color: var(--primary); text-align: center; margin-top: 0; border-bottom: 2px solid var(--accent); padding-bottom: 15px; margin-bottom: 25px; }
        
        /* 필터 섹션 스타일 */
        .filter-section { 
            background: #f1f4f8; 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            display: flex; 
            gap: 15px; 
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-weight: bold; color: var(--primary); }
        .filter-group select { 
            padding: 8px 12px; 
            border: 1px solid #cbd5e0; 
            border-radius: 6px; 
            background: white;
            font-size: 1em;
            cursor: pointer;
        }

        .status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: bold; color: #555; }
        .refresh-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .refresh-btn:hover { background: #2980b9; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 1.05em; }
        th, td { padding: 15px 12px; text-align: center; border-bottom: 1px solid #eee; }
        th { background-color: var(--primary); color: white; position: sticky; top: 0; }
        tr:hover { background-color: #f1f7fd; }
        
        .status-ing { color: #e67e22; font-weight: bold; background: #fdf2e9; padding: 5px 10px; border-radius: 20px; font-size: 0.9em; }
        .status-done { color: #27ae60; font-weight: bold; background: #e9f7ef; padding: 5px 10px; border-radius: 20px; font-size: 0.9em; }
        
        /* 필터링 결과 없음 메시지 */
        .no-data { padding: 50px; color: #a0aec0; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 안성여고 수행평가 실시간 현황판</h1>
    
    <div class="filter-section">
        <div class="filter-group">
            <label>학년</label>
            <select id="filterGrade" onchange="fetchData()">
                <option value="">-- 선택 --</option>
                <option value="1">1학년</option>
                <option value="2">2학년</option>
                <option value="3">3학년</option>
            </select>
        </div>
        <div class="filter-group">
            <label>반</label>
            <select id="filterClass" onchange="fetchData()">
                <option value="">-- 선택 --</option>
                <option value="1">1반</option><option value="2">2반</option>
                <option value="3">3반</option><option value="4">4반</option>
                <option value="5">5반</option><option value="6">6반</option>
                <option value="7">7반</option><option value="8">8반</option>
                <option value="9">9반</option><option value="10">10반</option>
                <option value="11">11반</option><option value="12">12반</option>
            </select>
        </div>
    </div>

    <div class="status-header">
        <span id="lastUpdated">대기 중 (조건 선택 필요)</span>
        <div>
            <span style="font-size: 0.9em; margin-right: 15px; color: #7f8c8d;">(5초마다 자동 갱신)</span>
            <button class="refresh-btn" onclick="fetchData()">🔄 즉시 새로고침</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>시작 시간</th>
                <th>학년</th>
                <th>반</th>
                <th>번호</th>
                <th>이름</th>
                <th>상태</th>
                <th>종료 시간</th>
                <th>소요 시간</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="8" class="no-data" style="color: var(--primary);">👆 상단에서 모니터링할 학년과 반을 모두 선택해 주세요.</td></tr>
        </tbody>
    </table>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxaszSktp0zGoiWTohe0v_npArxthOgbu5RHS-gXI03XzYI80FHvOh6-EvhpfLicco-/exec?sheet=status";

    async function fetchData() {
        const selectedGrade = document.getElementById('filterGrade').value;
        const selectedClass = document.getElementById('filterClass').value;
        const tbody = document.getElementById('tableBody');

        // ✅ 학년이나 반 중 하나라도 선택되지 않았다면 서버에 요청하지 않고 대기합니다.
        if (!selectedGrade || !selectedClass) {
            tbody.innerHTML = '<tr><td colspan="8" class="no-data" style="color: var(--primary);">👆 모니터링할 학년과 반을 모두 선택해 주세요.</td></tr>';
            document.getElementById('lastUpdated').innerText = "대기 중 (조건 선택 필요)";
            return; 
        }

        try {
            document.getElementById('lastUpdated').innerText = "데이터 불러오는 중...";
            
            const response = await fetch(GOOGLE_SCRIPT_URL);
            const data = await response.json();
            
            // 데이터 필터링 (선택된 학년과 반만 추출)
            const filteredData = data.filter(row => {
                const rowGrade = String(row['학년'] || "");
                const rowClass = String(row['반'] || "");
                
                const gradeMatch = (rowGrade === selectedGrade) || (rowGrade === selectedGrade + "학년");
                const classMatch = (rowClass === selectedClass) || (rowClass === selectedClass + "반");

                return gradeMatch && classMatch;
            });

            tbody.innerHTML = ''; 

            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="no-data">선택한 반에 접속하여 시험을 시작한 학생이 없습니다.</td></tr>';
                updateTime();
                return;
            }

            filteredData.forEach(row => {
                const tr = document.createElement('tr');
                
                const formatDate = (dateString) => {
                    if (!dateString) return "-";
                    const d = new Date(dateString);
                    if (isNaN(d)) return dateString; 
                    return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}:${d.getSeconds().toString().padStart(2, '0')}`;
                };

                let statusRaw = row['상태'] || '-';
                let statusHtml = statusRaw;
                if (statusRaw.includes('진행 중')) {
                    statusHtml = `<span class="status-ing">🟢 진행 중</span>`;
                } else if (statusRaw.includes('제출 완료')) {
                    statusHtml = `<span class="status-done">🔵 제출 완료</span>`;
                }

                tr.innerHTML = `
                    <td>${formatDate(row['시작시간'] || row['시작 시간'])}</td>
                    <td>${row['학년'] || '-'}</td>
                    <td>${row['반'] || '-'}</td>
                    <td>${row['번호'] || '-'}</td>
                    <td>${row['이름'] || '-'}</td>
                    <td>${statusHtml}</td>
                    <td>${formatDate(row['종료시간'] || row['종료 시간'])}</td>
                    <td>${row['소요시간'] || row['소요 시간'] || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
            
            updateTime();
        } catch (error) {
            console.error("데이터 로드 실패:", error);
            document.getElementById('lastUpdated').innerText = "데이터 갱신 오류 (인터넷 연결을 확인하세요)";
        }
    }

    function updateTime() {
        const now = new Date();
        document.getElementById('lastUpdated').innerText = `마지막 업데이트: ${now.toLocaleTimeString()}`;
    }

    // 5초마다 자동 갱신 (조건이 충족되었을 때만 fetchData 내부에서 작동)
    setInterval(fetchData, 5000);
</script>
</body>
</html>
